services:
  dashboard:
    build: .
    image: hmnd-dashboard:latest
    container_name: hmnd-dashboard
    restart: unless-stopped
    env_file: .env
    # Хост-порт 7501 (контейнер внутри слушает 8501).
    # Слушаем только localhost — закрой за своим reverse-proxy.
    # Если хочешь публиковать наружу: замени на "0.0.0.0:7501:8501" и открой firewall на :7501.
    ports:
      - "127.0.0.1:7501:8501"
    volumes:
      - ./data:/app/data
      # Source CSV/JSON drops live on the host so they survive image rebuilds.
      # Without this mount, extract_git_stats writes inside container and the
      # next `up --build` wipes them.
      - ./sources:/app/sources
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8501/_stcore/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Сайдкар: каждые 15 мин подтягивает свежие данные из OpenAI/Anthropic.
  sync:
    image: hmnd-dashboard:latest
    container_name: hmnd-sync
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./sources:/app/sources
    # Healthcheck for the sync sidecar: it's NOT running Streamlit, so the
    # image's default /_stcore/health probe would always report unhealthy.
    # Instead we touch a heartbeat file at the start of every loop iteration
    # and check that it's been written within the last 25 minutes (sync runs
    # every 15 min, so 25 gives one missed run of slack before alerting).
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/sync.heartbeat -mmin -25 | grep -q . || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[sync] starting periodic loop (every 15 min)";
        while true; do
          touch /tmp/sync.heartbeat;
          python -m scripts.sync --days 7 || echo "[sync] failed, will retry";
          sleep 900;
        done

  # Сайдкар: раз в сутки сохраняет dump report_i_data в snapshots/
  # для audit trail. Любой спор о цифрах решается за минуту — "что показывал
  # дашборд 3 дня назад?". 30 дней истории — больше не имеет смысла,
  # автоматически чистится find -mtime.
  snapshotter:
    image: hmnd-dashboard:latest
    container_name: hmnd-snapshotter
    restart: unless-stopped
    depends_on:
      dashboard:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./sources:/app/sources
      - ./snapshots:/app/snapshots
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/snapshotter.heartbeat -mmin -1500 | grep -q . || exit 1"]
      interval: 300s
      timeout: 5s
      retries: 2
      start_period: 60s
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "[snapshotter] daily Report I dump → /app/snapshots/";
        while true; do
          touch /tmp/snapshotter.heartbeat;
          DAY=$$(date -u +%F);
          OUT=/app/snapshots/$$DAY.txt;
          if [ ! -f "$$OUT" ]; then
            echo "[snapshotter] $$DAY: writing $$OUT";
            python -m scripts.report_i_data > "$$OUT" 2>&1 || echo "[snapshotter] dump failed for $$DAY";
            # Run identity-collision audit alongside — catches regressions.
            python -m scripts.audit_identity_collisions >> "$$OUT" 2>&1 || true;
            # Retention: keep last 30 days of snapshots.
            find /app/snapshots -name '*.txt' -mtime +30 -delete;
          fi;
          sleep 3600;
        done
